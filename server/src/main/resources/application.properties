spring.application.name=cometbot-server
server.port=8080

# Which profile: local (H2 in-memory) or prod (MySQL/RDS)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# AI service (FastAPI)
app.ai.url=${AI_URL:http://localhost:8000}
app.ai.extract-timeout-seconds=${AI_EXTRACT_TIMEOUT_SECONDS:120}
# Titan Text Express reads ~8K tokens; keep in step with MAX_SYLLABUS_CHARS in ai/main.py
app.syllabus.max-chars=20000

# REST API key (X-API-Key header). Empty = unauthenticated, for local dev only.
app.api.key=${API_KEY:}

# Syllabus file uploads (POST /api/guilds/{id}/syllabus/file)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Discord (JDA) - empty means bot is disabled (REST-only mode)
discord.token=${DISCORD_TOKEN:}
discord.owner-id=${DISCORD_OWNER_ID:}

# Reminders
reminder.tz=${REMINDER_TZ:America/Chicago}
reminder.before-days=3
reminder.interval-ms=1800000

# Actuator
management.endpoints.web.exposure.include=health,info

# Avoid lazy-loading surprises in controllers
spring.jpa.open-in-view=false
