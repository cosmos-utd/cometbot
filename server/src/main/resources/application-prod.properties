# Production: MySQL on AWS RDS (creds come from env vars, never from files)
# DB_SSL_MODE: REQUIRED encrypts the connection; use VERIFY_IDENTITY with the RDS CA bundle for full verification.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cometbot}?sslMode=${DB_SSL_MODE:REQUIRED}&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
